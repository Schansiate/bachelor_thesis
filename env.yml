name: ba
channels:
  - conda-forge
  - bioconda
dependencies:
  # --- Python ---
  - python=3.14.4
  - ipykernel=7.2.0
  - ipython=9.12.0
  - numpy=2.4.3
  - pandas=3.0.2
  - scipy=1.17.1
  - scikit-learn=1.8.0
  - matplotlib=3.10.8
  - seaborn=0.13.2
  - adjusttext=1.3.0
  - requests=2.33.1
  - tqdm=4.68.3
  - graphtools=1.5.3
  - graph-tool=2.98
  - yaml=0.2.5
  - pyyaml=6.0.3
  # Imported by notebooks but not currently installed in the `ba` env (left unpinned)
  - pybiomart
  - mygene
  - bioconda::gprofiler-official
  # --- R ---
  - r-base=4.5.3
  - r-irkernel=1.3.2
  - r-tidyverse=2.0.0
  - r-dplyr=1.2.1
  - r-tidyr=1.3.2
  - r-readr=2.2.0
  - r-stringr=1.6.0
  - r-tibble=3.3.1
  - r-purrr=1.2.2
  - r-scales=1.4.0
  - r-ggplot2=4.0.3
  - r-patchwork=1.3.2
  - r-pheatmap=1.0.13
  - r-rcolorbrewer=1.1_3
  - r-data.table=1.18.6.1
  - r-gridextra=2.3.1
  - r-gtable=0.3.6
  - r-matrixstats=1.5.0
  # Imported by notebooks but not currently installed in the `ba` env (left unpinned)
  - r-igraph
  # --- pip (not available on conda) ---
  - pip
  - pip:
      # Imported by notebooks but not currently installed in the `ba` env
      - xenaPython
